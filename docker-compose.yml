services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lp
      POSTGRES_PASSWORD: lp
      POSTGRES_DB: lp_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lp -d lp_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lp:lp@postgres:5432/lp_intelligence
      REDIS_URL: redis://redis:6379/0
      DEALCLOUD_BASE_URL: http://mock-dealcloud:8001
    volumes:
      - ./backend:/app
      - doc_storage:/data/docs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://lp:lp@postgres:5432/lp_intelligence
      REDIS_URL: redis://redis:6379/0
      DEALCLOUD_BASE_URL: http://mock-dealcloud:8001
    volumes:
      - ./backend:/app
      - doc_storage:/data/docs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  mock-dealcloud:
    build:
      context: ./mock-dealcloud
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"

volumes:
  postgres_data:
  doc_storage:
