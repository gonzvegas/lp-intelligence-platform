[project]
name = "lp-intelligence-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "alembic>=1.13",
    "pydantic-settings>=2.3",
    "celery[redis]>=5.4",
    "langchain>=0.2",
    "langchain-text-splitters>=0.2",
    "langchain-anthropic>=0.1",
    "langchain-voyageai>=0.1",
    "pypdf>=4.3",
    "pgvector>=0.3",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "cryptography>=42",
    "python-jose[cryptography]>=3.3",
    "pyjwt>=2.8",
    "azure-storage-blob>=12.19",
    "azure-identity>=1.16",
]

[tool.setuptools.packages.find]
where = ["."]
